<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>SPM Admin</title><link rel="icon" href="/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="wrap"><nav><a class="brand" href="/"><img src="/favicon.png" alt=""><span>SPM Admin</span></a><span class="sp"></span><button id="out" class="btn o s" hidden>تسجيل الخروج</button></nav></div></header>
<main class="wrap">
<section id="lg"><h2>دخول المالك</h2><form id="lf"><label>الإيميل<input id="em" type="email" required autocomplete="username"></label><label>الباسورد<input id="pw" type="password" required autocomplete="current-password"></label><button class="btn">دخول</button></form><div id="le" role="alert"></div></section>
<section id="app" hidden><p id="st" class="msg ok"></p>
<div class="row2" id="tabs"></div>
<div id="tp"><div class="row2"><button id="np" class="btn s">إضافة مشروع</button></div>
<form id="pf" hidden style="margin-top:14px">
<label>اسم المشروع<input name="name" maxlength="120"></label>
<label>وصف قصير (عربي)<input name="shortAr" maxlength="300"></label>
<label>Short description (English)<input name="shortEn" maxlength="300" dir="ltr"></label>
<label>الوصف الكامل (عربي)<textarea name="descAr" maxlength="3000"></textarea></label>
<label>Full description (English)<textarea name="descEn" maxlength="3000" dir="ltr"></textarea></label>
<label>التصنيف<input name="category" maxlength="60"></label>
<label>التقنيات (افصل بينها بفاصلة)<input name="tech" maxlength="300" dir="ltr"></label>
<label>رابط العرض المباشر<input name="demoUrl" type="text" dir="ltr" placeholder="https://"></label>
<label>رابط المستودع (اختياري)<input name="repoUrl" type="text" dir="ltr" placeholder="https://"></label>
<label class="ck"><input name="featured" type="checkbox">مشروع مميز</label>
<label class="ck"><input name="published" type="checkbox">منشور على الموقع</label>
<label>لوجو المشروع / الصورة الرئيسية<input id="pimg" type="file" accept="image/jpeg,image/png,image/webp"></label>
<img id="pv" class="th" alt="" style="max-width:260px" hidden>
<div class="row2"><button type="button" id="rmi" class="btn o s">إزالة الصورة</button></div>
<label>صور إضافية من داخل التطبيق (اختار أكتر من صورة، حتى 8)<input id="gimg" type="file" multiple accept="image/jpeg,image/png,image/webp"></label>
<div id="gpv" class="row2"></div>
<div id="pe" role="alert"></div>
<div class="row2"><button class="btn" id="sv">حفظ</button><button type="button" id="cn" class="btn o">إلغاء</button></div></form>
<div id="pl" style="margin-top:16px"></div></div>
<div id="tr" hidden><div class="row2"><input id="rq" placeholder="بحث" style="max-width:240px"><select id="rs" style="max-width:200px"><option value="">كل الحالات</option></select></div><div id="rl" style="margin-top:14px"></div></div>
<div id="tg" hidden></div>
</section></main>
<script type="module">
import {auth,db,collection,doc,getDocs,getDoc,setDoc,addDoc,updateDoc,deleteDoc,serverTimestamp,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "/firebase.js";
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={new:'جديد',reviewing:'قيد المراجعة',inprogress:'قيد التنفيذ',completed:'مكتمل',rejected:'مرفوض'};
let P=[],R=[],cur=null,newImg='',rmImg=false;
const say=(el,c,m)=>{el.className=m?'msg '+c:'';el.textContent=m||''};
$('#rs').innerHTML+=Object.entries(S).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#lf').onsubmit=async e=>{e.preventDefault();say($('#le'),'er','');try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(x){say($('#le'),'er',['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(x.code)?'الإيميل أو الباسورد غير صحيح.':x.code==='auth/too-many-requests'?'محاولات كثيرة. انتظر قليلًا ثم أعد المحاولة.':'تعذّر الدخول: '+(x.code||x.message))}};
$('#out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{$('#out').hidden=!u;if(!u){$('#lg').hidden=false;$('#app').hidden=true;return}
try{await load();$('#lg').hidden=true;$('#app').hidden=false}catch(e){await signOut(auth);say($('#le'),'er',e.code==='permission-denied'?'هذا الحساب غير مصرّح له بدخول لوحة الأدمن.':'تعذّر تحميل البيانات: '+(e.code||e.message))}});
async function load(){const[a,b]=await Promise.all([getDocs(collection(db,'projects')),getDocs(collection(db,'projectRequests'))]);
P=a.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.order||0)-(y.order||0));R=b.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));stats();drawP();drawR()}
function stats(){const n=P.filter(p=>p.published).length,c=s=>R.filter(r=>r.status===s).length;$('#st').textContent=`المشاريع: ${P.length} (منشور ${n}، مسودة ${P.length-n}) | الطلبات: ${R.length} (جديد ${c('new')}، قيد التنفيذ ${c('inprogress')}، مكتمل ${c('completed')})`}
function drawP(){$('#pl').innerHTML=P.length?P.map(p=>`<div class="card"><b>${esc(p.name||'(بدون اسم)')}</b> <span class="tag">${p.published?'منشور':'مسودة'}</span>${p.featured?'<span class="tag">مميز</span>':''}<div class="row2"><button class="btn o s" data-e="${p.id}">تعديل</button><button class="btn o s" data-up="projects:${p.id}">▲</button><button class="btn o s" data-dn="projects:${p.id}">▼</button><button class="btn d s" data-x="${p.id}">حذف</button></div></div>`).join(''):'<p class="empty">لا توجد مشاريع بعد. اضغط "إضافة مشروع" للبدء.</p>'}
const shrink=f=>new Promise((ok,no)=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>8e6)return no('نوع الصورة غير مدعوم أو حجمها أكبر من 8MB.');const i=new Image();i.onload=()=>{const w=Math.min(900,i.width),c=document.createElement('canvas');c.width=w;c.height=i.height*w/i.width;c.getContext('2d').drawImage(i,0,0,c.width,c.height);let q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>380000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}u.length>380000?no('الصورة كبيرة جدًا حتى بعد الضغط.'):ok(u)};i.onerror=()=>no('تعذّرت قراءة الصورة.');i.src=URL.createObjectURL(f)});
let gal=[],galOld=[];
const drawG=()=>{$('#gpv').innerHTML=gal.map((x,i)=>`<div style="position:relative"><img class="th" src="${esc(x.src)}" alt="" style="width:110px;aspect-ratio:1;margin:0"><button type="button" class="btn d s" data-gd="${i}" style="position:absolute;top:4px;inset-inline-end:4px;padding:2px 8px">✕</button></div>`).join('')};
async function edit(p){cur=p;newImg='';rmImg=false;const f=$('#pf');f.hidden=false;say($('#pe'),'er','');for(const k of['name','shortAr','shortEn','descAr','descEn','category','tech','demoUrl','repoUrl'])f.elements[k].value=p?.[k]??'';f.elements.featured.checked=!!p?.featured;f.elements.published.checked=p?!!p.published:true;f.elements.pimg&&0;$('#pimg').value='';$('#pv').hidden=true;
if(p?.image){try{const s=await getDoc(doc(db,'images',p.image));if(s.exists()){$('#pv').src=s.data().data;$('#pv').hidden=false}}catch{}}
gal=[];galOld=p?.gallery||[];$('#gimg').value='';drawG();
for(const id of galOld){try{const g=await getDoc(doc(db,'images',id));if(g.exists())gal.push({id,src:g.data().data})}catch{}}drawG();f.scrollIntoView()}
$('#np').onclick=()=>edit(null);$('#cn').onclick=()=>{$('#pf').hidden=true};
$('#pimg').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{newImg=await shrink(f);rmImg=false;$('#pv').src=newImg;$('#pv').hidden=false;say($('#pe'),'ok','تمت معاينة الصورة. اضغط حفظ للرفع.')}catch(x){newImg='';e.target.value='';say($('#pe'),'er',x)}};
$('#gimg').onchange=async e=>{for(const f of e.target.files){if(gal.length>=8){say($('#pe'),'er','الحد الأقصى 8 صور إضافية.');break}try{const u=await shrink(f);gal.push({data:u,src:u})}catch(x){say($('#pe'),'er',x)}}drawG();e.target.value=''};
$('#rmi').onclick=()=>{newImg='';rmImg=true;$('#pimg').value='';$('#pv').hidden=true};
$('#pf').onsubmit=async e=>{e.preventDefault();const f=e.target,v=n=>f.elements[n].value.trim(),b=$('#sv');say($('#pe'),'er','');
b.disabled=true;b.textContent='جارٍ الحفظ…';
try{const old=cur?.image||'';let img=old;
if(newImg){img=(await addDoc(collection(db,'images'),{data:newImg,createdAt:serverTimestamp()})).id}else if(rmImg)img='';
const gids=[];for(const x of gal)gids.push(x.id||(await addDoc(collection(db,'images'),{data:x.data,createdAt:serverTimestamp()})).id);
const gone=galOld.filter(i=>!gids.includes(i));
const d={name:v('name'),shortAr:v('shortAr'),shortEn:v('shortEn'),descAr:v('descAr'),descEn:v('descEn'),category:v('category'),tech:v('tech'),demoUrl:v('demoUrl'),repoUrl:v('repoUrl'),order:cur?(cur.order||0):P.length,featured:f.elements.featured.checked,published:f.elements.published.checked,image:img,gallery:gids,updatedAt:serverTimestamp()};
if(cur)await updateDoc(doc(db,'projects',cur.id),d);else await addDoc(collection(db,'projects'),{...d,createdAt:serverTimestamp()});
if(old&&old!==img)await deleteDoc(doc(db,'images',old)).catch(()=>{});
for(const i of gone)await deleteDoc(doc(db,'images',i)).catch(()=>{});
f.hidden=true;await load()}catch(x){say($('#pe'),'er','تعذّر الحفظ: '+(x.code||x.message))}
b.disabled=false;b.textContent='حفظ'};
function drawR(){const q=$('#rq').value.toLowerCase(),s=$('#rs').value,L=R.filter(r=>(!s||r.status===s)&&(!q||[r.name,r.contact,r.title,r.description].join(' ').toLowerCase().includes(q)));
$('#rl').innerHTML=L.length?L.map(r=>`<div class="card"><b>${esc(r.title)}</b><p>${esc(r.name)} | ${esc(r.contact)} ${esc(r.phone||'')}</p><p>${esc(r.type)} | الميزانية: ${esc(r.budget||'-')} | الموعد: ${esc(r.deadline||'-')} | ${r.createdAt?r.createdAt.toDate().toLocaleString('ar-EG'):''}</p><p style="color:var(--tx);white-space:pre-wrap">${esc(r.description)}</p><p>رقم الطلب: ${esc(r.id)}</p>
<label>الحالة<select id="s-${r.id}">${Object.entries(S).map(([k,v])=>`<option value="${k}"${r.status===k?' selected':''}>${v}</option>`).join('')}</select></label>
<label>ملاحظات داخلية (خاصة بك فقط)<textarea id="n-${r.id}" maxlength="2000">${esc(r.adminNotes||'')}</textarea></label>
<div class="row2"><button class="btn s" data-sv="${r.id}">حفظ</button><button class="btn d s" data-rx="${r.id}">حذف</button></div></div>`).join(''):'<p class="empty">لا توجد طلبات مطابقة.</p>'}
$('#rq').oninput=drawR;$('#rs').onchange=drawR;
document.addEventListener('click',async e=>{const g=k=>e.target.dataset[k];
try{if(g('gd')){gal.splice(+g('gd'),1);drawG()} else if(g('e'))edit(P.find(p=>p.id===g('e')));
else if(g('x')){const p=P.find(p=>p.id===g('x'));if(confirm(`حذف المشروع "${p.name}" نهائيًا؟`)){if(p.image)await deleteDoc(doc(db,'images',p.image)).catch(()=>{});for(const i of p.gallery||[])await deleteDoc(doc(db,'images',i)).catch(()=>{});await deleteDoc(doc(db,'projects',p.id));await load()}}
else if(g('sv')){await updateDoc(doc(db,'projectRequests',g('sv')),{status:$('#s-'+g('sv')).value,adminNotes:$('#n-'+g('sv')).value.trim(),updatedAt:serverTimestamp()});await setDoc(doc(db,'requestStatus',g('sv')),{status:$('#s-'+g('sv')).value,title:String(R.find(r=>r.id===g('sv'))?.title||'').slice(0,150),updatedAt:serverTimestamp()},{merge:true});await load()}
else if(g('rx')){if(confirm('حذف هذا الطلب نهائيًا؟')){await deleteDoc(doc(db,'projectRequests',g('rx')));await deleteDoc(doc(db,'requestStatus',g('rx'))).catch(()=>{});await load()}}}
catch(x){alert('تعذّرت العملية: '+(x.code||x.message))}});

const F=(k,l,t='text',x={})=>({k,l,t,...x}),BI=(k,l,e,t='text')=>[F(k+'Ar',l+' (عربي)',t),F(k+'En',e+' (English)',t,{ltr:1})];
const SC={
packages:{n:'الباقات',tk:'nameAr',f:[F('icon','أيقونة (إيموجي، اختياري)'),...BI('name','اسم الباقة / الخدمة','Name'),...BI('desc','الوصف','Description','area'),F('price','أقل سعر للباقة، يظهر كـ "يبدأ من"','num'),F('currency','العملة'),F('oldPrice','السعر القديم (اختياري)','num'),F('customQuote','يتطلب عرض سعر مخصص','bool'),...BI('delivery','مدة التسليم','Delivery'),F('revisions','عدد التعديلات (اختياري)','num'),...BI('badge','شارة (مثل: الأكثر طلبًا)','Badge'),...BI('features','المميزات (سطر لكل ميزة)','Features (one per line)','area'),F('image','الصورة (اختياري)','img'),F('published','نشط ومنشور','bool')]},
promotions:{n:'العروض',tk:'titleAr',f:[...BI('title','العنوان','Title'),...BI('desc','الوصف','Description','area'),F('percent','نسبة الخصم %','num'),F('fixed','خصم ثابت (جنيه)','num'),F('start','تاريخ البداية','date'),F('end','تاريخ النهاية','date'),F('coupon','كوبون عام (يظهر للزوار — لا تكتب كوبونًا خاصًا هنا)'),F('usageLimit','حد الاستخدام (للتسجيل فقط، لا يُفرض تلقائيًا)','num'),...BI('terms','الشروط','Terms','area'),F('onHome','يظهر في الرئيسية','bool'),F('image','الصورة (اختياري)','img'),F('published','نشط ومنشور','bool')]},
faqs:{n:'الأسئلة',tk:'qAr',f:[...BI('q','السؤال','Question'),...BI('a','الإجابة','Answer','area'),F('draft','مسودة تحتاج مراجعتك (ملاحظة داخلية)','bool'),F('image','الصورة (اختياري)','img'),F('published','منشور','bool')]}};
const SS=[F('','الصفحة الرئيسية','hd'),...BI('tagline','الشعار النصي','Tagline'),...BI('heroP','نص الهيرو','Hero text','area'),F('','إظهار الأقسام','hd'),F('showPricing','إظهار الباقات','bool',{d:true}),F('showAbout','إظهار عن SPM','bool',{d:true}),F('showFaq','إظهار الأسئلة الشائعة','bool',{d:true}),
F('','عن SPM','hd'),F('aboutImage','صورة قسم عن SPM (اختياري)','img'),...BI('about','التعريف','Intro','area'),...BI('mission','الرسالة','Mission','area'),...BI('values','القيم (سطر لكل قيمة)','Values (one per line)','area'),...BI('workflow','خطوات العمل (سطر لكل خطوة)','Workflow (one step per line)','area'),F('skills','المهارات والتقنيات (افصل بفاصلة)','text',{ltr:1}),
F('','التواصل','hd'),F('email','البريد الإلكتروني'),F('phone','الهاتف'),F('whatsapp','واتساب (بالصيغة الدولية)'),...BI('address','العنوان','Address'),
F('','روابط التواصل الاجتماعي','hd'),F('instagram','Instagram','url'),F('facebook','Facebook','url'),F('x','X','url'),F('youtube','YouTube','url'),F('tiktok','TikTok','url'),F('linkedin','LinkedIn','url'),
F('','الفوتر وSEO','hd'),...BI('footer','نص الفوتر','Footer text'),F('seoTitle','عنوان SEO'),F('seoDesc','وصف SEO'),F('defaultLang','اللغة الافتراضية','sel',{o:[['ar','العربية'],['en','English']]})];
const SEED={packages:[['تطوير المواقع','Website development','🌐'],['مواقع الشركات والأعمال','Business and company websites','🏢'],['تطبيقات الويب PWA','Progressive Web Apps (PWA)','📱'],['برامج وحلول مخصصة','Custom software','💻'],['تطوير الألعاب','Game development','🎮'],['حلول رقمية حسب الطلب','Custom digital solutions','🧩']].map(([a,b,i])=>({nameAr:a,nameEn:b,icon:i,published:false})),
faqs:[['كيف أطلب مشروعًا؟','How do I request a project?','املأ نموذج طلب المشروع في الموقع وسنتواصل معك.','Fill in the project request form on the website and we will contact you.'],['كم السعر؟','How much does it cost?','قد يبدأ السعر من حوالي 100 جنيه، والسعر النهائي يعتمد على المتطلبات والتعقيد ووقت التسليم.','Prices may start around EGP 100; the final price depends on requirements, complexity and delivery time.'],['كم تستغرق مدة التسليم؟','How long does delivery take?','تعتمد على حجم المشروع، ونحدد المدة بعد مراجعة طلبك.','It depends on project size; we confirm the timeline after reviewing your request.'],['هل يمكن التعديل بعد التسليم؟','Can I request revisions?','نتفق على عدد التعديلات قبل بدء العمل.','We agree on the number of revisions before work starts.'],['هل تساعدون في الاستضافة والدومين؟','Do you help with hosting and domains?','نساعدك في اختيار الاستضافة والدومين وإعدادهما.','We help you choose and set up hosting and a domain.'],['هل توجد صيانة بعد التسليم؟','Is maintenance available after delivery?','الصيانة والدعم بعد التسليم بالاتفاق.','Maintenance and support after delivery are by agreement.'],['ما أنواع المشاريع التي تنفذونها؟','What types of projects do you build?','مواقع، تطبيقات ويب PWA، برامج مخصصة، ألعاب، وحلول رقمية حسب الطلب.','Websites, PWAs, custom software, games and custom digital solutions.']].map(([a,b,c,d])=>({qAr:a,qEn:b,aAr:c,aEn:d,draft:true,published:false}))};
const dir=f=>f.ltr?' dir="ltr"':' dir="auto"';
const imgBlock=f=>`<div><label>${f.l}<input type="file" data-fi="${f.k}" accept="image/jpeg,image/png,image/webp"></label><img class="th" data-pv="${f.k}" alt="" style="max-width:260px" hidden><div class="row2"><button type="button" class="btn o s" data-rmi="${f.k}">إزالة الصورة</button></div></div>`;
const inp=(f,v)=>{const n=`name="${f.k}"`;if(f.t==='hd')return`<h3 style="margin-top:10px">${f.l}</h3>`;if(f.t==='img')return imgBlock(f);if(f.t==='bool')return`<label class="ck"><input ${n} type="checkbox"${v?' checked':''}>${f.l}</label>`;if(f.t==='area')return`<label>${f.l}<textarea ${n}${dir(f)} maxlength="3000">${esc(v)}</textarea></label>`;if(f.t==='sel')return`<label>${f.l}<select ${n}>${f.o.map(([a,b])=>`<option value="${a}"${v===a?' selected':''}>${b}</option>`).join('')}</select></label>`;return`<label>${f.l}<input ${n}${dir(f)} type="text" value="${esc(v)}" maxlength="300"></label>`};
const rd=(fs,form)=>{const o={};for(const f of fs){if(f.t==='hd'||f.t==='img')continue;const e=form.elements[f.k];o[f.k]=f.t==='bool'?e.checked:e.value.trim()}return o};
let IMS={},gsd={};
async function loadPv(fs,data){IMS={};for(const f of fs.filter(f=>f.t==='img')){IMS[f.k]={new:'',rm:false};const id=data?.[f.k];if(id){try{const s=await getDoc(doc(db,'images',id));if(s.exists()){const e=document.querySelector(`[data-pv="${f.k}"]`);if(e){e.src=s.data().data;e.hidden=false}}}catch{}}}}
async function saveImgs(fs,d,old){const dl=[];for(const f of fs.filter(f=>f.t==='img')){const s=IMS[f.k]||{},o=old?.[f.k]||'';let id=o;if(s.new)id=(await addDoc(collection(db,'images'),{data:s.new,createdAt:serverTimestamp()})).id;else if(s.rm)id='';d[f.k]=id;if(o&&o!==id)dl.push(o)}return dl}
document.addEventListener('change',async e=>{const k=e.target.dataset.fi;if(!k)return;const f=e.target.files[0];if(!f)return;try{const u=await shrink(f);IMS[k]={new:u,rm:false};const p=document.querySelector(`[data-pv="${k}"]`);p.src=u;p.hidden=false;say($('#ge'),'ok','تمت معاينة الصورة. اضغط حفظ للرفع.')}catch(x){e.target.value='';say($('#ge'),'er',x)}});
let G={},gk='',gcur=null;const gp=$('#tg');
async function gopen(k){gk=k;gcur=null;if(k==='site'){const s=await getDoc(doc(db,'site','main')),sd=s.exists()?s.data():{};gp.innerHTML=`<form id="gf">${SS.map(f=>inp(f,sd[f.k]??f.d??'')).join('')}<div id="ge" role="alert"></div><button class="btn">حفظ الإعدادات</button></form>`;gsd=sd;loadPv(SS,sd);return}
G[k]=(await getDocs(collection(db,k))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));if(k==='packages'){try{OLD=(await getDocs(collection(db,'services'))).size}catch{OLD=0}}gdraw()}
let OLD=0;const nm=p=>p[SC[gk].tk]||p[SC[gk].tk.replace('Ar','En')]||'(بدون عنوان)';
function gdraw(){const c=SC[gk],L=G[gk];gp.innerHTML=`<div class="row2"><button class="btn s" data-ga="1">إضافة</button>${SEED[gk]?`<button class="btn o s" data-seed="1">إضافة محتوى مبدئي (مسودات غير منشورة)</button>`:''}${gk==='packages'&&OLD?`<button class="btn o s" data-mig="1">نقل الخدمات القديمة (${OLD}) إلى الباقات</button>`:''}</div><form id="gf" hidden style="margin-top:14px"></form><div style="margin-top:16px">${L.length?L.map(p=>`<div class="card"><b>${esc(nm(p))}</b> <span class="tag">${p.published?'منشور':'مسودة'}</span><div class="row2"><button class="btn o s" data-ge="${p.id}">تعديل</button><button class="btn o s" data-up="${gk}:${p.id}">▲</button><button class="btn o s" data-dn="${gk}:${p.id}">▼</button><button class="btn d s" data-gx="${p.id}">حذف</button></div></div>`).join(''):'<p class="empty">لا يوجد محتوى بعد. اضغط "إضافة".</p>'}</div>`}
function gform(p){gcur=p;const f=$('#gf');f.hidden=false;f.innerHTML=SC[gk].f.map(x=>inp(x,p?(p[x.k]??(x.k==='currency'?'EGP':'')):(x.k==='published'?true:x.k==='currency'?'EGP':''))).join('')+'<div id="ge" role="alert"></div><div class="row2"><button class="btn">حفظ</button><button type="button" class="btn o" data-gc="1">إلغاء</button></div>';loadPv(SC[gk].f,p);f.scrollIntoView()}
async function mv(c,id,d){const L=c==='projects'?P:G[c],i=L.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];await Promise.all(L.map((x,n)=>(x.order||0)===n?0:updateDoc(doc(db,c,x.id),{order:n})));if(c==='projects')await load();else await gopen(c)}
function tab(n){['tp','tr','tg'].forEach(i=>{$('#'+i).hidden=true});$(n==='p'?'#tp':n==='r'?'#tr':'#tg').hidden=false;document.querySelectorAll('#tabs .btn').forEach(b=>{b.className=b.dataset.tab===n?'btn s':'btn o s'});if(SC[n]||n==='site')gopen(n).catch(x=>alert('تعذّر التحميل: '+(x.code||x.message)))}
$('#tabs').innerHTML=[['p','المشاريع'],['r','الطلبات'],...Object.entries(SC).map(([k,c])=>[k,c.n]),['site','الإعدادات']].map(([k,l])=>`<button class="btn ${k==='p'?'':'o '}s" data-tab="${k}">${l}</button>`).join('');
document.addEventListener('submit',async e=>{if(e.target.id!=='gf')return;e.preventDefault();const f=e.target,ge=$('#ge');try{if(gk==='site'){const sd=rd(SS,f),sdl=await saveImgs(SS,sd,gsd);await setDoc(doc(db,'site','main'),{...sd,updatedAt:serverTimestamp()},{merge:true});for(const i of sdl)await deleteDoc(doc(db,'images',i)).catch(()=>{});await gopen('site');say($('#ge'),'ok','تم الحفظ. التغييرات تظهر على الموقع فورًا.');return}
const fs=SC[gk].f,d=rd(fs,f),dl=await saveImgs(fs,d,gcur);
if(gcur)await updateDoc(doc(db,gk,gcur.id),{...d,updatedAt:serverTimestamp()});else await addDoc(collection(db,gk),{...d,order:G[gk].length,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});for(const i of dl)await deleteDoc(doc(db,'images',i)).catch(()=>{});await gopen(gk)}catch(x){say(ge,'er','تعذّر الحفظ: '+(x.code||x.message))}});
document.addEventListener('click',async e=>{const g=k=>e.target.dataset[k];try{
if(g('tab'))tab(g('tab'));
else if(g('rmi')){const k=g('rmi');IMS[k]={new:'',rm:true};const pv=document.querySelector(`[data-pv="${k}"]`);if(pv)pv.hidden=true;const fi=document.querySelector(`[data-fi="${k}"]`);if(fi)fi.value=''}
else if(g('up')){const[c,id]=g('up').split(':');await mv(c,id,-1)}
else if(g('dn')){const[c,id]=g('dn').split(':');await mv(c,id,1)}
else if(g('ga'))gform(null);
else if(g('ge'))gform(G[gk].find(p=>p.id===g('ge')));
else if(g('gc'))$('#gf').hidden=true;
else if(g('gx')){const p=G[gk].find(p=>p.id===g('gx'));if(confirm(`حذف "${nm(p)}" نهائيًا؟`)){if(p.image)await deleteDoc(doc(db,'images',p.image)).catch(()=>{});await deleteDoc(doc(db,gk,p.id));await gopen(gk)}}
else if(g('mig')){if(confirm('سيتم نقل كل الخدمات القديمة إلى الباقات (بنفس الصور والبيانات) ثم حذفها من الخدمات. متابعة؟')){const sv=await getDocs(collection(db,'services'));let n=G.packages.length;for(const d of sv.docs){const x=d.data();await addDoc(collection(db,'packages'),{nameAr:x.titleAr||'',nameEn:x.titleEn||'',descAr:x.descAr||'',descEn:x.descEn||'',icon:x.icon||'',price:x.startPrice||'',currency:'EGP',deliveryAr:x.deliveryAr||'',deliveryEn:x.deliveryEn||'',featuresAr:x.featuresAr||'',featuresEn:x.featuresEn||'',image:x.image||'',published:!!x.published,order:n++,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});await deleteDoc(d.ref)}await gopen('packages')}}
else if(g('seed')){if(confirm('سيتم إضافة مسودات غير منشورة لتراجعها وتعدّلها. متابعة؟')){const n=G[gk].length;await Promise.all(SEED[gk].map((d,i)=>addDoc(collection(db,gk),{...d,order:n+i,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})));await gopen(gk)}}
}catch(x){alert('تعذّرت العملية: '+(x.code||x.message))}});
</script></body></html>
